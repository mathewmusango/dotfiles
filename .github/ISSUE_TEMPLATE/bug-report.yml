name: Bug report
description: Report a problem with the dotfiles
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue.
  - type: input
    id: where
    attributes:
      label: Where
      description: Which module, script or config?
      placeholder: <path>
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (Arch Linux)
        - Container / CI
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, console errors, etc.
