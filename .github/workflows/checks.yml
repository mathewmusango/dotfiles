name: checks

# The check reusables live in the shared workflow library
# (mathewmusango/my-workflows), pinned to a commit SHA. The trailing `# vN` names
# the library tag that SHA is — Dependabot can only version-map a SHA pin when
# that comment is present.
#
# Runs on pull requests into `main` — the gate the ruleset enforces — plus manual
# dispatch. Nothing runs on a push, so a bypass push straight to `main` is
# unchecked: the PR is the single gate. The reusables self-gate, so an untouched
# surface skips and reports success, which is what lets the ruleset require them
# all without blocking an unrelated PR.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jsonc:
    uses: mathewmusango/my-workflows/.github/workflows/checks-jsonc.yml@60bbf7e773dae68e8a4884698def52a8c63f20cf # v2026.0916.0520
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@60bbf7e773dae68e8a4884698def52a8c63f20cf # v2026.0916.0520
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@60bbf7e773dae68e8a4884698def52a8c63f20cf # v2026.0916.0520
  secrets:
    uses: mathewmusango/my-workflows/.github/workflows/security-secrets.yml@60bbf7e773dae68e8a4884698def52a8c63f20cf # v2026.0916.0520
  deps:
    uses: mathewmusango/my-workflows/.github/workflows/security-deps.yml@60bbf7e773dae68e8a4884698def52a8c63f20cf # v2026.0916.0520
