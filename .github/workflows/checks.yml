name: checks

# The check reusables live in the shared workflow library
# (mathewmusango/myprojects), pinned to the v1 tag.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jsonc:
    uses: mathewmusango/myprojects/.github/workflows/checks-jsonc.yml@v1
  shell:
    uses: mathewmusango/myprojects/.github/workflows/checks-shell.yml@v1
  yaml:
    uses: mathewmusango/myprojects/.github/workflows/checks-yaml.yml@v1
