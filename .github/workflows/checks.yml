name: checks

# The check reusables live in the shared workflow library
# (mathewmusango/my-workflows), pinned to a commit SHA.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jsonc:
    uses: mathewmusango/my-workflows/.github/workflows/checks-jsonc.yml@b5d076b992526405c469346ae33dced92e162504
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@b5d076b992526405c469346ae33dced92e162504
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@b5d076b992526405c469346ae33dced92e162504
