name: checks

# The check reusables live in the shared workflow library
# (mathewmusango/my-workflows), pinned to a commit SHA.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jsonc:
    uses: mathewmusango/my-workflows/.github/workflows/checks-jsonc.yml@f9746fe152f3388a5d96c865158942a73b5560a9
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@f9746fe152f3388a5d96c865158942a73b5560a9
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@f9746fe152f3388a5d96c865158942a73b5560a9
  secrets:
    uses: mathewmusango/my-workflows/.github/workflows/security-secrets.yml@f9746fe152f3388a5d96c865158942a73b5560a9
