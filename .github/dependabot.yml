version: 2
updates:
  # Dependabot can only bump a SHA-pinned action when the pin carries a trailing
  # "# vN" comment — the shared check reusables are pinned deliberately instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
