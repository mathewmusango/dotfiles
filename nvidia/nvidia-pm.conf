# NVIDIA hybrid-graphics (Optimus) power management.
# Applies when the nvidia / nvidia_drm modules load.

# Fine-grained runtime power management: the dGPU powers down when idle and wakes
# on demand (CUDA, PRIME render offload). Requires nvidia-persistenced.
options nvidia NVreg_DynamicPowerManagement=0x02

# Kernel mode-setting — needed for Wayland and for reliable runtime PM.
options nvidia_drm modeset=1
